# Three run modes share the same image; pick one service to start.
#
#   docker compose up                      # gateway only (default profile)
#   docker compose up mcp-http             # HTTP/SSE MCP on :18790 (bearer-auth)
#   docker compose run --rm -i mcp-stdio   # local stdio MCP for `claude mcp add`
#
# mcp-http / mcp-stdio are behind compose profiles so they don't auto-start
# alongside the gateway (all three share the same named volume, and
# racing on its first-mount init caused "file exists" errors).
#
# To run gateway + mcp-http together, activate the `http` profile:
#   docker compose --profile http up

services:
  gateway:
    build: .
    image: clodds:latest
    container_name: clodds-gateway
    command: ["node", "dist/index.js"]
    ports:
      - "18789:18789"
    env_file:
      - .env
    environment:
      CLODDS_STATE_DIR: /data
      CLODDS_WORKSPACE: /data/workspace
      CLODDS_CONFIG_PATH: /data/clodds.json
    volumes:
      - clodds_data:/data
    restart: unless-stopped

  # Reuses the clodds:latest image built by the `gateway` service.
  # Run `docker compose build gateway` once before `docker compose up mcp-http`.
  mcp-http:
    image: clodds:latest
    profiles: ["http", "mcp"]
    container_name: clodds-mcp-http
    command: ["node", "dist/bin/mcp-http.js"]
    ports:
      - "18790:18790"
    env_file:
      - .env
    environment:
      CLODDS_STATE_DIR: /data
      CLODDS_WORKSPACE: /data/workspace
      CLODDS_MCP_PORT: "18790"
      HEALTHCHECK_PORT: "18790"
    volumes:
      - clodds_data:/data
    restart: unless-stopped

  mcp-stdio:
    image: clodds:latest
    profiles: ["stdio", "mcp"]
    container_name: clodds-mcp-stdio
    command: ["node", "dist/bin/mcp-stdio.js"]
    stdin_open: true
    tty: false
    env_file:
      - .env
    environment:
      CLODDS_STATE_DIR: /data
      CLODDS_WORKSPACE: /data/workspace
    volumes:
      - clodds_data:/data

volumes:
  clodds_data:
